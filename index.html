<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Taxi Shahapur - Live Booking System</title>
    
    <!-- Firebase App & Firestore SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAm3HFXu19lWex1b025-zJz2BJ_aIXvw",
            authDomain: "ar-taxi-booking-shahapur.firebaseapp.com",
            projectId: "ar-taxi-booking-shahapur",
            storageBucket: "ar-taxi-booking-shahapur.appspot.com",
            messagingSenderId: "586815719897",
            appId: "1:586815719897:web:ab7138b9c016843db95dea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Expose firestore functions globally for our app logic
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.serverTimestamp = serverTimestamp;
    </script>

    <style>
        :root { --primary: #0fb05b; --secondary: #96c93d; --bg: #f4f7f6; --text: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 10px; }
        .container { width: 100%; max-width: 480px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .logo-title { display: flex; align-items: center; gap: 8px; }
        .mainTitle { font-size: 1.1rem; font-weight: bold; color: #2c3e50; }
        .subTitle { font-size: 0.75rem; color: #7f8c8d; }
        .lang-btn { background: #eef2fe; border: 1px solid #bae1fd; padding: 8px 12px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        .section { display: none; }
        .section.active { display: block; }
        h2 { font-size: 1.05rem; margin-bottom: 12px; color: #2d3748; border-left: 4px solid var(--primary); padding-left: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 4px; color: #4a5568; }
        input, select { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 0.9rem; }
        .btn-gps, .btn-submit { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-top: 6px; }
        .btn-submit { background: linear-gradient(45deg, #0fb05b, #96c93d); color: white; }
        .booking-card { background: #fff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .footer { text-align: center; font-size: 0.75rem; color: #7f8c8d; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-title">
            <span>🚖</span>
            <div>
                <div class="mainTitle" id="mainTitleText">AR Taxi Shahapur</div>
                <div class="subTitle" id="subTitleText">ಶಹಾಪುರ ನಗರದ ನಂಬರ್ 1 ಟ್ಯಾಕ್ಸಿ ಸೇವೆ</div>
            </div>
        </div>
        <button class="lang-btn" onclick="toggleLanguage()" id="langToggleBtn">English</button>
    </div>

    <!-- Customer Booking Form Section -->
    <div id="customerSection" class="section active">
        <h2 id="formHeading">ಯಾತ್ರೆ ಬುಕ್ ಮಾಡಿ (Book a Ride)</h2>
        <div class="form-group">
            <label id="lblCustomerName">ನಿಮ್ಮ ಹೆಸರು (Customer Name)</label>
            <input type="text" id="custName" placeholder="ಹೆಸರು ನಮೂದಿಸಿ">
        </div>
        <div class="form-group">
            <label id="lblCustomerPhone">ಮೊಬೈಲ್ ಸಂಖ್ಯೆ (Phone Number)</label>
            <input type="tel" id="custPhone" placeholder="ಫೋನ್ ನಂಬರ್">
        </div>
        <div class="form-group">
            <label id="lblPickup">ಎಲ್ಲಿಂದ ಹೊರಡಬೇಕು (Pickup Location)</label>
            <input type="text" id="pickupLoc" placeholder="ಸ್ಥಳದ ಹೆಸರು">
        </div>
        <div class="form-group">
            <label id="lblDrop">ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕು (Drop Location)</label>
            <input type="text" id="dropLoc" placeholder="ತಲುಪಬೇಕಾದ ಸ್ಥಳ">
        </div>
        <button class="btn-submit" onclick="submitBooking()" id="btnSubmitRide">ಬುಕ್ ಮಾಡಿ (Book Ride)</button>
        <button class="btn-gps" style="background:#edf2f7; margin-top:10px;" onclick="switchToDriver()">ಡ್ರೈವರ್ ಲಾಗಿನ್ / Driver View</button>
    </div>

    <!-- Driver Dashboard Section -->
    <div id="driverSection" class="section">
        <h2>ಡ್ರೈವರ್ ಲೈವ್ ಬುಕಿಂಗ್ಸ್‌ (Live Bookings)</h2>
        <div id="driverBookingsList">ಬುಕಿಂಗ್‌ಗಳಿಗಾಗಿ ಕಾಯಲಾಗುತ್ತಿದೆ...</div>
        <button class="btn-gps" style="background:#edf2f7; margin-top:15px;" onclick="switchToCustomer()">← ಗ್ರಾಹಕ ಪುಟಕ್ಕೆ ಹಿಂತಿರುಗಿ</button>
    </div>

    <div class="footer">
        © 2026 AR Taxi Booking Shahapur. All rights reserved.
    </div>
</div>

<script>
    let currentLang = 'kn';

    function toggleLanguage() {
        currentLang = currentLang === 'kn' ? 'en' : 'kn';
        document.getElementById('langToggleBtn').innerText = currentLang === 'kn' ? 'English' : 'ಕನ್ನಡ';
        document.getElementById('mainTitleText').innerText = currentLang === 'kn' ? 'AR Taxi Shahapur' : 'AR Taxi Shahapur';
        document.getElementById('subTitleText').innerText = currentLang === 'kn' ? 'ಶಹಾಪುರ ನಗರದ ನಂಬರ್ 1 ಟ್ಯಾಕ್ಸಿ ಸೇವೆ' : 'No.1 Taxi Service in Shahapur';
        document.getElementById('formHeading').innerText = currentLang === 'kn' ? 'ಯಾತ್ರೆ ಬುಕ್ ಮಾಡಿ (Book a Ride)' : 'Book a Ride';
        document.getElementById('lblCustomerName').innerText = currentLang === 'kn' ? 'ನಿಮ್ಮ ಹೆಸರು (Customer Name)' : 'Customer Name';
        document.getElementById('lblCustomerPhone').innerText = currentLang === 'kn' ? 'ಮೊಬೈಲ್ ಸಂಖ್ಯೆ (Phone Number)' : 'Phone Number';
        document.getElementById('lblPickup').innerText = currentLang === 'kn' ? 'ಎಲ್ಲಿಂದ ಹೊರಡಬೇಕು (Pickup Location)' : 'Pickup Location';
        document.getElementById('lblDrop').innerText = currentLang === 'kn' ? 'ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕು (Drop Location)' : 'Drop Location';
        document.getElementById('btnSubmitRide').innerText = currentLang === 'kn' ? 'ಬುಕ್ ಮಾಡಿ (Book Ride)' : 'Book Ride';
    }

    function switchToDriver() {
        document.getElementById('customerSection').classList.remove('active');
        document.getElementById('driverSection').classList.add('active');
        listenToBookings();
    }

    function switchToCustomer() {
        document.getElementById('driverSection').classList.remove('active');
        document.getElementById('customerSection').classList.add('active');
    }

    // Submit Booking to Firestore
    async function submitBooking() {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const pickup = document.getElementById('pickupLoc').value.trim();
        const drop = document.getElementById('dropLoc').value.trim();

        if(!name || !phone || !pickup || !drop) {
            alert('ದಯವಿಟ್ಟು ಎಲ್ಲಾ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ!');
            return;
        }

        try {
            await window.addDoc(window.collection(window.db, "bookings"), {
                name: name,
                phone: phone,
                pickup: pickup,
                drop: drop,
                status: 'Pending',
                timestamp: window.serverTimestamp()
            });
            alert('ನಿಮ್ಮ ಟ್ಯಾಕ್ಸಿ ಬುಕಿಂಗ್ ಯಶಸ್ವಿಯಾಗಿ ಡ್ರೈವರ್‌ಗಳಿಗೆ ತಲುಪಿದೆ!');
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('pickupLoc').value = '';
            document.getElementById('dropLoc').value = '';
        } catch (e) {
            console.error("Error adding booking: ", e);
            alert('ಬುಕಿಂಗ್ ಮಾಡುವಲ್ಲಿ ದೋಷ ಉಂಟಾಗಿದೆ. ದಯವಿಟ್ಟು ಮರುಪ್ರಯತ್ನಿಸಿ.');
        }
    }

    // Real-time synchronization for Drivers using Firestore onSnapshot
    function listenToBookings() {
        const listDiv = document.getElementById('driverBookingsList');
        window.onSnapshot(window.collection(window.db, "bookings"), (snapshot) => {
            let html = '';
            if (snapshot.empty) {
                listDiv.innerHTML = '<p>ಯಾವುದೇ ಹೊಸ ಬುಕಿಂಗ್‌ಗಳು ಇಲ್ಲ.</p>';
                return;
            }
            snapshot.forEach((docSnap) => {
                const b = docSnap.data();
                const id = docSnap.id;
                html += `
                    <div class="booking-card">
                        <p><b>ಹೆಸರು (Name):</b> ${b.name}</p>
                        <p><b>ಫೋನ್ (Phone):</b> <a href="tel:${b.phone}">${b.phone}</a></p>
                        <p><b>ಇಲ್ಲಿಂದ (Pickup):</b> ${b.pickup}</p>
                        <p><b>ಇಲ್ಲಿಗೆ (Drop):</b> ${b.drop}</p>
                        <p><b>ಸ್ಥಿತಿ (Status):</b> <span style="color:green; font-weight:bold;">${b.status}</span></p>
                        <button onclick="acceptBooking('${id}')" style="background:#0fb05b; color:white; border:none; padding:6px 12px; border-radius:6px; margin-top:6px; cursor:pointer;">ಸ್ವೀಕರಿಸಿ (Accept)</button>
                        <button onclick="deleteBooking('${id}')" style="background:#e53e3e; color:white; border:none; padding:6px 12px; border-radius:6px; margin-top:6px; margin-left:6px; cursor:pointer;">ಮುಕ್ತಾಯ/ಅಮಾನ್ಯ (Delete)</button>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        });
    }

    async function acceptBooking(id) {
        try {
            const docRef = window.doc(window.db, "bookings", id);
            await window.updateDoc(docRef, { status: 'Accepted by Driver' });
            alert('ಬುಕಿಂಗ್ ಸ್ವೀಕರಿಸಲಾಗಿದೆ!');
        } catch (e) {
            console.error("Error updating: ", e);
        }
    }

    async function deleteBooking(id) {
        if(confirm('ಈ ಬುಕಿಂಗ್ ಅನ್ನು ತೆಗೆದುಹಾಕಲು ಬಯಸುತ್ತೀರಾ?')) {
            try {
                await window.deleteDoc(window.doc(window.db, "bookings", id));
            } catch (e) {
                console.error("Error deleting: ", e);
            }
        }
    }
</script>

</body>
</html>
