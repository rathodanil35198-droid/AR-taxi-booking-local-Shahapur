<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Taxi Shahapur - Live Meter & Booking</title>
    <!-- Happy Logo Icon -->
    <link rel="icon" type="image/png" href="happy_logo.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo {
            width: 90px;
            height: 90px;
            margin-bottom: 10px;
            border-radius: 50%;
            object-fit: cover;
        }
        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #218838;
        }
        .stop-btn {
            background-color: #dc3545;
        }
        .stop-btn:hover {
            background-color: #c82333;
        }
        .whatsapp-btn {
            background-color: #25D366;
            margin-top: 15px;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }
        #resultBox {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            font-size: 18px;
            color: #333;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Happy Logo -->
    <img src="happy_logo.png" alt="Happy Logo" class="logo">
    <h2>AR Taxi Shahapur</h2>

    <p style="color: #666; font-size: 14px;">ಲೈವ್ ಜಿಪಿಎಸ್ ಆಟೋ ಮೀಟರ್</p>

    <!-- Controls -->
    <button class="btn" onclick="startLiveTracking()">ರೈಡ್ ಸ್ಟಾರ್ಟ್ ಮಾಡಿ (Start Meter)</button>
    <button class="btn stop-btn" onclick="stopLiveTracking()">ರೈಡ್ ನಿಲ್ಲಿಸಿ (Stop)</button>

    <!-- Live Result Display -->
    <div id="resultBox">
        <b>ಸ್ಥಿತಿ:</b> ನಿಂತಿದೆ<br>
        <b>ಒಟ್ಟು ದೂರ:</b> 0.00 ಕಿ.ಮೀ<br>
        <b>ಒಟ್ಟು ಬಾಡಿಗೆ:</b> ರೂ. 0.00
    </div>

    <!-- WhatsApp Share Button -->
    <button class="btn whatsapp-btn" onclick="shareOnWhatsApp()">WhatsApp ನಲ್ಲಿ ಶೇರ್ ಮಾಡಿ</button>
</div>

<script>
    let watchId = null;
    let previousCoords = null;
    let totalDistance = 0;

    // ಭೂಮಿಯ ಮೇಲಿನ ಎರಡು ಜಿಪಿಎಸ್ ಪಾಯಿಂಟ್‌ಗಳ ನಡುವಿನ ದೂರ ಅಳೆಯುವ ಸೂತ್ರ (Haversine Formula)
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // ಕಿ.ಮೀ
        const dLat = (lat2 - lat1) * (Math.PI / 180);
        const dLon = (lon2 - lon1) * (Math.PI / 180);
        const a = 
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c; // ದೂರ ಕಿ.ಮೀ ನಲ್ಲಿ ಸಿಗುತ್ತದೆ
    }

    // ಲೈವ್ ಜಿಪಿಎಸ್ ಟ್ರ್ಯಾಕಿಂಗ್ ಆರಂಭಿಸುವುದು
    function startLiveTracking() {
        if ("geolocation" in navigator) {
            totalDistance = 0;
            previousCoords = null;
            
            document.getElementById('resultBox').innerHTML = "<b>ಸ್ಥಿತಿ:</b> ಜಿಪಿಎಸ್ ಕನೆಕ್ಟ್ ಆಗುತ್ತಿದೆ... ಚಲಿಸಿ.<br><b>ಒಟ್ಟು ದೂರ:</b> 0.00 ಕಿ.ಮೀ<br><b>ಒಟ್ಟು ಬಾಡಿಗೆ:</b> ರೂ. 200 (ಬೆಲೆ ನಿಗದಿ)";

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const currentCoords = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };

                    if (previousCoords) {
                        // ಹಿಂದಿನ ಮತ್ತು ಪ್ರಸ್ತುತ ಸ್ಥಳದ ನಡುವಿನ ದೂರ ಲೆಕ್ಕಾಚಾರ
                        const distanceMoved = calculateDistance(
                            previousCoords.latitude,
                            previousCoords.longitude,
                            currentCoords.latitude,
                            currentCoords.longitude
                        );

                        // ಅತಿ ചെറിയ ಜಿಪಿಎಸ್ ವ್ಯತ್ಯಾಸಗಳನ್ನು (10 ಮೀಟರ್‌ಗಿಂತ ಕಡಿಮೆ) ನಿರ್ಲಕ್ಷಿಸಲು (GPS Jitter filter)
                        if (distanceMoved > 0.005) { 
                            totalDistance += distanceMoved;
                            updateMeterDisplay(totalDistance, "ಚಲಿಸುತ್ತಿದೆ (Running)");
                        }
                    }

                    previousCoords = currentCoords;
                },
                (error) => {
                    alert("ಜಿಪಿಎಸ್ ಸಿಗ್ನಲ್ ಸಿಗುತ್ತಿಲ್ಲ. ದಯವಿಟ್ಟು ಲೊಕೇಶನ್ ಆನ್ ಮಾಡಿ.");
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                }
            );
        } else {
            alert("ನಿಮ್ಮ ಬ್ರೌಸರ್ ಜಿಪಿಎಸ್ ಬೆಂಬಲಿಸುವುದಿಲ್ಲ.");
        }
    }

    // ಟ್ರ್ಯಾಕಿಂಗ್ ನಿಲ್ಲಿಸುವುದು
    function stopLiveTracking() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            updateMeterDisplay(totalDistance, "ರೈಡ್ ಮುಕ್ತಗೊಂಡಿದೆ (Completed)");
        }
    }

    // ಮೀಟರ್ ಮತ್ತು ದರ ಲೆಕ್ಕಾಚಾರ ಅಪ್‌ಡೇಟ್ ಮಾಡುವುದು
    function updateMeterDisplay(distance, statusText) {
        let totalFare = 0;

        // ನಿಯಮ: 3 ಕಿ.ಮೀ ವರೆಗೆ ರೂ. 200, ನಂತರ ಪ್ರತಿ 1 ಕಿ.ಮೀಗೆ ರೂ. 15
        if (distance <= 3) {
            totalFare = 200;
        } else {
            totalFare = 200 + (distance - 3) * 15;
        }

        document.getElementById('resultBox').innerHTML = `
            <b>ಸ್ಥಿತಿ:</b> ${statusText}<br>
            <b>ಒಟ್ಟು ದೂರ:</b> ${distance.toFixed(2)} ಕಿ.ಮೀ<br>
            <b>ಒಟ್ಟು ಬಾಡಿಗೆ:</b> ರೂ. ${totalFare.toFixed(2)}
        `;
    }

    // ವಾಟ್ಸಾಪ್ ಶೇರ್ ಫಂಕ್ಷನ್
    function shareOnWhatsApp() {
        const appLink = window.location.href;
        const message = encodeURIComponent("ಶಾಹಾಪುರದಲ್ಲಿ ಆಟೋ ಅಥವಾ ಟ್ಯಾಕ್ಸಿ ಬೇಕಾದಲ್ಲಿ ಈ ಆಪ್ ಬಳಸಿ ಬುಕ್ ಮಾಡಿ: " + appLink);
        window.open(`https://api.whatsapp.com/send?text=${message}`, '_blank');
    }
</script>

</body>
</html>
