<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Taxi Shahpur | ಆಟೋ ಬುಕಿಂಗ್ ಅಪ್‌ | Car Booking App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #faf8f5; box-sizing: border-box; }
        *, *::before, *::after { box-sizing: border-box; }
        .container { max-width: 600px; margin: auto; padding: 20px; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 2px solid #0f050b; }
        .btn-submit { background: #3182ce; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .whatsapp-btn { background: #25d366; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold; }
        .support-btn { background: #e53e3e; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Role Selection Screen -->
        <div id="roleSelectionScreen">
            <h1 style="font-size: 1.5rem; color: #2c3a50; text-align: center;">AR Taxi Shahpur</h1>
            <p style="text-align: center; color: #7f8c8d;">ಚಾಯ್ಸ್ ಮಾಡಿ / Select Your Role</p>
            
            <button onclick="selectRole('customer')" class="btn-submit" style="margin-bottom: 10px;">
                🛺 ಗ್ರಾಹಕನ್ ಬಟನ್ & ಜುಮ್ಕಾ? (Customer Booking & Meter)
            </button>
            <button onclick="selectRole('driver')" class="btn-submit" style="background: #2b6cb0;">
                🚗 ಡ್ರೈವರ್ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ & ಅಡ್ಮಿನ್ (Driver Dashboard & Admin)
            </button>
        </div>

        <!-- Main App Content -->
        <div id="mainAppContent" style="display: none;">
            <button onclick="goBackToRoleSelection()" class="btn-submit" style="background: #718096; margin-bottom: 15px;">⬅️ (Change Role)</button>

            <!-- Navigation Tabs -->
            <div id="navTabsContainer" style="display: flex; gap: 5px; margin-bottom: 15px;"></div>

            <!-- 1. Customer Section -->
            <div id="customerSection" class="section active">
                <h2 style="color: #2c3a50;">Book Your Ride</h2>
                <div class="card">
                    <label>Select Vehicle:</label>
                    <div style="display: flex; gap: 10px; margin: 10px 0;">
                        <button onclick="selectVehicle('Auto')" id="cardAuto" class="btn-submit" style="background: #edf2f7; color: #000;">🛺 Auto</button>
                        <button onclick="selectVehicle('Car')" id="cardCar" class="btn-submit" style="background: #edf2f7; color: #000;">🚗 Car</button>
                    </div>
                    <input type="hidden" id="vehicleType" value="Auto">

                    <label>Your Name:</label>
                    <input type="text" id="custName" style="width:100%; padding:8px; margin:5px 0 10px 0;" placeholder="ನಿಮ್ಮ ಹೆಸರು">

                    <label>Mobile Number:</label>
                    <input type="tel" id="custPhone" style="width:100%; padding:8px; margin:5px 0 10px 0;" placeholder="ಫೋನ್ ನಂಬರ್">

                    <label>Number of Passengers:</label>
                    <select id="passengerCount" style="width:100%; padding:8px; margin:5px 0 10px 0;">
                        <option value="1">1 Person</option>
                        <option value="2">2 Persons</option>
                        <option value="3">3 Persons</option>
                    </select>

                    <label>Pickup Location:</label>
                    <input type="text" id="pickuploc" style="width:100%; padding:8px; margin:5px 0 10px 0;" placeholder="ಪಿಕ್ಅಪ್ ಸ್ಥಳ">
                    <button onclick="getLocation()" class="btn-submit" style="background: #d69e2e; margin-bottom: 10px;">📍 Get GPS Location</button>

                    <label>Drop Location:</label>
                    <input type="text" id="droproc" style="width:100%; padding:8px; margin:5px 0 10px 0;" placeholder="ಡ್ರಾಪ್ ಸ್ಥಳ">

                    <button onclick="submitBooking()" class="btn-submit">Book Ride</button>
                </div>
                <div id="customerStatusContainer"></div>
            </div>

            <!-- 2. Driver Profile / Registration Section -->
            <div id="profileSection" class="section">
                <h2 style="color: #2c3a50;">Driver Registration / Profile</h2>
                <div class="card">
                    <label>Driver Name:</label>
                    <input type="text" id="drvName" style="width:100%; padding:8px; margin:5px 0 10px 0;" placeholder="ನಿಮ್ಮ ಹೆಸರು">

                    <label>Mobile Number:</label>
                    <input type="tel" id="drvPhone" style="width:100%; padding:8px; margin:5px 0 10px 0;" placeholder="ಫೋನ್ ನಂಬರ್">

                    <label>Vehicle Number:</label>
                    <input type="text" id="drvVehNo" style="width:100%; padding:8px; margin:5px 0 10px 0;" placeholder="ಉದಾ: KA-33-...">

                    <label>Vehicle Type:</label>
                    <select id="drvVehType" style="width:100%; padding:8px; margin:5px 0 10px 0;">
                        <option value="Auto">🛺 Auto</option>
                        <option value="Car">🚗 Car</option>
                    </select>

                    <button onclick="registerDriver()" class="btn-submit">Login / Register</button>
                </div>
            </div>

            <!-- 3. Admin Panel Section (Where Delete is Included) -->
            <div id="adminSection" class="section">
                <h2 style="color: #2c3a50;">Admin Panel</h2>
                <p>View or delete driver profiles here...</p>
                <div id="adminDriversList"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUserRole = '';

        function selectRole(role) {
            currentUserRole = role;
            document.getElementById('roleSelectionScreen').style.display = 'none';
            document.getElementById('mainAppContent').style.display = 'block';
            
            if (role === 'customer') {
                switchTab('customer');
            } else {
                const pass = prompt("ಅಡ್ಮಿನ್ ಪಿನ್ ಕೋಡ್ ನಮೂದಿಸಿ: / Enter Admin Code:");
                if (pass === "8105010768") {
                    switchTab('admin');
                    loadAdminData();
                } else {
                    alert("ತಪ್ಪು ಕೋಡ್! / Incorrect Code");
                    goBackToRoleSelection();
                }
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            if (tabName === 'customer') document.getElementById('customerSection').classList.add('active');
            if (tabName === 'profile') document.getElementById('profileSection').classList.add('active');
            if (tabName === 'admin') document.getElementById('adminSection').classList.add('active');
        }

        function goBackToRoleSelection() {
            document.getElementById('mainAppContent').style.display = 'none';
            document.getElementById('roleSelectionScreen').style.display = 'block';
        }

        function selectVehicle(type) {
            document.getElementById('vehicleType').value = type;
            if (type === 'Auto') {
                document.getElementById('cardAuto').style.background = '#3182ce';
                document.getElementById('cardAuto').style.color = '#fff';
                document.getElementById('cardCar').style.background = '#edf2f7';
                document.getElementById('cardCar').style.color = '#000';
            } else {
                document.getElementById('cardCar').style.background = '#3182ce';
                document.getElementById('cardCar').style.color = '#fff';
                document.getElementById('cardAuto').style.background = '#edf2f7';
                document.getElementById('cardAuto').style.color = '#000';
            }
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById('pickuploc').value = `GPS (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
                    alert("GPS ಸ್ಥಳ ಯಶಸ್ವಿಯಾಗಿ ಪಡೆಯಲಾಗಿದೆ! / GPS location obtained successfully!");
                }, () => {
                    alert("GPS ಆನ್ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ. ಕರುಣೆಟ್ಟು, ಲೊಕೇಶನ್ ಆನ್ ಮಾಡಿ.");
                });
            }
        }

        function registerDriver() {
            const name = document.getElementById('drvName').value.trim();
            const phone = document.getElementById('drvPhone').value.trim();
            const vehNo = document.getElementById('drvVehNo').value.trim();
            
            if (!name || !phone || !vehNo) {
                alert("ದಯವಿಟ್ಟು ಎಲ್ಲ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ! / Please fill all details!");
                return;
            }
            alert("ಡ್ರೈವರ್ ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ! / Successfully registered!");
            document.getElementById('drvName').value = '';
            document.getElementById('drvPhone').value = '';
            document.getElementById('drvVehNo').value = '';
        }

        function submitBooking() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const pickup = document.getElementById('pickuploc').value.trim();
            const drop = document.getElementById('droproc').value.trim();

            if (!name || !phone || !pickup || !drop) {
                alert("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಅಗತ್ಯ ಮಾಹಿತಿಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ! / Please fill all required information!");
                return;
            }
            alert("ನಿಮ್ಮ ಬುಕಿಂಗ್ ಯಶಸ್ಿಯಾಗಿದೆ! / Your booking is successful!");
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('pickuploc').value = '';
            document.getElementById('droproc').value = '';
        }

        function loadAdminData() {
            const adminDiv = document.getElementById('adminDriversList');
            // ಡ್ರೈವರ್ ಅನ್ನು ಡಿಲೀಟ್ ಮಾಡುವ ಬಟನ್ ಮತ್ತು ಫಂಕ್ಷನ್ ಇಲ್ಲಿ ವ್ಯವಸ್ಥೆಗೊಳಿಸಲಾಗಿದೆ:
            adminDiv.innerHTML = `
                <div class="card">
                    <p><b>ಡ್ರೈವರ್ ಹೆಸರು:</b> ಉದಾಹರಣೆ ಡ್ರೈವರ್</p>
                    <button onclick="deleteDriver('sample_id')" class="btn-submit" style="background: #e53e3e;">ಡಿಲೀಟ್ (Delete)</button>
                </div>
            `;
        }

        // ಡ್ರೈವರ್ ಡಿಲೀಟ್ ಮಾಡುವ ಮುಖ್ಯ ಕಾರ್ಯ (Delete Function)
        function deleteDriver(id) {
            const code = prompt("ಡ್ರೈವರ್ ಡಿಲೀಟ್ ಮಾಡಲು ಅಡ್ಮಿನ್ ಪಿನ್ ಕೋಡ್ ಹಾಕಿ (8105010768): / Enter Admin Code:");
            if (code === "8105010768") {
                try {
                    // ಡೇಟಾಬೇಸ್ ಅಥವಾ ಲಿಸ್ಟ್‌ನಿಂದ ಡಿಲೀಟ್ ಮಾಡುವ ಕೋಡ್ ಇಲ್ಲಿ ಇರುತ್ತದೆ
                    alert("ಡ್ರೈವರ್ ಯಶಸ್ವಾಗಿ ಡಿಲೀಟ್ ಆಗಿದೆ! / Driver deleted successfully.");
                    loadAdminData();
                } catch (e) {
                    console.error(e);
                }
            } else if (code !== null) {
                alert("ತಪ್ಪು ಕೋಡ್! / Incorrect Code");
            }
        }
    </script>
</body>
</html>
