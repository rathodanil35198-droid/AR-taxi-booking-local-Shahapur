<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Taxi Shahapur</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --accent-color: #1976d2;
            --glow-color: #00e676;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 70px;
        }
        .header-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #b71c1c;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 69, 0, 0.6);
            margin: 10px 0;
        }
        .btn-attractive {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
            animation: glowing 1.5s infinite alternate;
        }
        @keyframes glowing {
            0% { box-shadow: 0 0 5px var(--glow-color); }
            100% { box-shadow: 0 0 20px var(--glow-color), 0 0 30px var(--glow-color); }
        }
        .btn-primary-custom { background: linear-gradient(45deg, #1976d2, #42a5f5); }
        .btn-success-custom { background: linear-gradient(45deg, #2e7d32, #66bb6a); }
        
        /* Floating Glowing WhatsApp Share Button */
        .floating-share-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background-color: #25d366;
            color: white;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.6);
            z-index: 1000;
            text-decoration: none;
            animation: pulse-glow 1.2s infinite alternate;
        }
        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 5px #25d366; }
            100% { transform: scale(1.05); box-shadow: 0 0 25px #25d366; }
        }

        .form-control {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        /* Image Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            text-align: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 80vh;
            margin: auto;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">⭐ ಕರ್ನಾಟಕ - ಶಹಾಪುರ ⭐</div>
    
    <!-- Main Selection View -->
    <div id="main-view">
        <div style="text-align:center; margin: 20px 0;">
            <img src="1000380294.jpg" alt="Taxi" style="width: 80px; height: auto;">
            <h3>AR Taxi Shahapur</h3>
            <p>ಯಾದಗಿರಿ ಜಿಲ್ಲೆ, ಶಹಾಪುರ ಲೋಕಲ್ ಸೇವೆಗೆ ಸ್ವಾಗತ!</p>
        </div>
        <button class="btn-attractive btn-primary-custom" onclick="switchView('booking-view')">🚖 ಕಸ್ಟಮರ್ ಬುಕಿಂಗ್ & ಮೀಟರ್</button>
        <button class="btn-attractive btn-success-custom" onclick="switchView('driver-view')">🚙 ಡ್ರೈವರ್ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ & ಅಡ್ಮಿನ್</button>
    </div>

    <!-- Driver Registration & Login View -->
    <div id="driver-view" style="display:none;">
        <button onclick="switchView('main-view')" style="margin-bottom:10px;" class="form-control">⬅ ಹಿಂದಕ್ಕೆ (Back)</button>
        <h3>ಡ್ರೈವರ್ ರಜಿಸ್ಟ್ರೇಷನ್ / ಪ್ರೊಫೈಲ್</h3>
        <div class="card">
            <input type="text" id="d-name" class="form-control" placeholder="ಡ್ರೈವರ್ ಹೆಸರು">
            <input type="tel" id="d-mobile" class="form-control" placeholder="ಮೊಬೈಲ್ ನಂಬರ್">
            <input type="text" id="d-vehicle" class="form-control" placeholder="ವಾಹನ ನಂಬರ್ (ಉದಾ: Ka33k8976)">
            <select id="d-type" class="form-control">
                <option>🛺 ಆಟೋ (Auto)</option>
                <option>🚗 ಟ್ಯಾಕ್ಸಿ (Taxi)</option>
            </select>
            <label>ಫೋಟೋಗಳು / ದಾಖಲೆಗಳು ಅಪ್ಲೋಡ್:</label>
            <input type="file" id="d-files" class="form-control" multiple accept="image/*">
            <button class="btn-attractive btn-success-custom" onclick="registerDriver()">ಲಾಗಿನ್ / ರಜಿಸ್ಟರ್ ಮಾಡಿ</button>
        </div>

        <!-- Admin Panel Section inside Driver View -->
        <div style="margin-top: 20px;">
            <h3>ಅಡ್ಮಿನ್ ಪ್ಯಾನಲ್</h3>
            <input type="text" id="search-box" class="form-control" placeholder="ವೆಹಿಕಲ್ ನಂಬರ್, ಮೊಬೈಲ್ ಅಥವಾ ಐಡಿ ಮೂಲಕ ಸರ್ಚ್ ಮಾಡಿ..." onkeyup="searchDrivers()">
            <div id="driver-list-container"></div>
        </div>
    </div>

    <!-- Booking & Live Meter View -->
    <div id="booking-view" style="display:none;">
        <button onclick="switchView('main-view')" style="margin-bottom:10px;" class="form-control">⬅ ಹಿಂದಕ್ಕೆ (Back)</button>
        <h3>ಡ್ರೈವರ್ ಲೈವ್ ಮೀಟರ್</h3>
        <div class="card">
            <p>ಪ್ರಯಾಣಿಸಿದ ದೂರ: <span id="distance-val">0.0</span> ಕಿ.ಮೀ</p>
            <h3>ಅಂದಾಜು ಶುಲ್ಕ: ₹<span id="fare-val">0</span></h3>
            <button class="btn-attractive btn-primary-custom" onclick="startMeter()">ಮೀಟರ್ ಸ್ಟಾರ್ಟ್ ಮಾಡಿ</button>
            <button class="btn-attractive" style="background:#d32f2f; color:white;" onclick="stopMeter()">ಮೀಟರ್ ಆಫ್ ಮಾಡಿ</button>
        </div>
    </div>

</div>

<!-- Floating Glowing WhatsApp Share Button (Visible across app) -->
<a href="https://wa.me/?text=Download%20AR%20Taxi%20Shahapur%20App" target="_blank" class="floating-share-btn">
    <img src="1000380294.jpg" alt="WA" style="width:24px; height:24px; border-radius:50%;"> ಈ ಆಪ್ ಅನ್ನು ಶೇರ್ ಮಾಡಿ
</a>

<!-- Image Zoom Modal -->
<div id="imgModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImg">
    <a id="downloadBtn" href="" download class="btn-attractive btn-primary-custom" style="max-width: 200px; margin: 20px auto;">ಡೌನ್ಲೋಡ್ ಮಾಡಿ</a>
</div>

<script>
    function switchView(viewId) {
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('driver-view').style.display = 'none';
        document.getElementById('booking-view').style.display = 'none';
        document.getElementById(viewId).style.display = 'block';
    }

    // Mock Database for Drivers with Serial Numbers
    let drivers = [
        { id: 8960, name: "Yejbdhs", mobile: "9085213484", vehicle: "Ka33u4318 (Auto)", images: ["1000380266.jpg"] },
        { id: 2341, name: "Anilrathod", mobile: "9653285425", vehicle: "Ka331254 (Auto)", images: ["1000380013.jpg"] }
    ];

    function renderDrivers(dataToRender) {
        let container = document.getElementById('driver-list-container');
        container.innerHTML = "";
        dataToRender.forEach((d, index) => {
            let imgHtml = d.images.map(img => `<img src="${img}" style="width:50px; height:50px; object-fit:cover; cursor:pointer; margin:2px; border-radius:4px;" onclick="openModal('${img}')">`).join('');
            container.innerHTML += `
                <div class="card">
                    <b>ಸಂಖ್ಯೆ (Sl No): ${index + 1} | ID: ${d.id}</b>
                    <p><b>ಹೆಸರು:</b> ${d.name}</p>
                    <p><b>ಮೊಬೈಲ್:</b> ${d.mobile}</p>
                    <p><b>ವಾಹನ:</b> ${d.vehicle}</p>
                    <div><b>ಫೋಟೋಗಳು:</b><br>${imgHtml}</div>
                </div>
            `;
        });
    }

    function registerDriver() {
        let name = document.getElementById('d-name').value;
        let mobile = document.getElementById('d-mobile').value;
        let vehicle = document.getElementById('d-vehicle').value;
        
        if(!name || !mobile || !vehicle) {
            alert("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಮಾಹಿತಿ ಭರ್ತಿ ಮಾಡಿ!");
            return;
        }

        // Check if mobile already exists for instant seamless login/flow
        let existing = drivers.find(d => d.mobile === mobile);
        if(existing) {
            alert("ಈ ಮೊಬೈಲ್ ನಂಬರ್ ಈಗಾಗಲೇ ನೋಂದಾಯಿಸಲಾಗಿದೆ! ನೇರವಾಗಿ ಬುಕಿಂಗ್ ಪೇಜಿಗೆ ಹೋಗಲಾಗುತ್ತಿದೆ.");
            switchView('booking-view');
            return;
        }

        let newDriver = {
            id: Math.floor(1000 + Math.random() * 9000),
            name: name,
            mobile: mobile,
            vehicle: vehicle,
            images: ["1000380266.jpg"] // Placeholder for uploaded file
        };
        drivers.push(newDriver);
        alert("ಯಶಸ್ವಿಯಾಗಿ ನೋಂದಾಯಿಸಲಾಗಿದೆ!");
        switchView('booking-view');
        renderDrivers(drivers);
    }

    function searchDrivers() {
        let query = document.getElementById('search-box').value.toLowerCase();
        let filtered = drivers.filter(d => 
            d.name.toLowerCase().includes(query) || 
            d.mobile.includes(query) || 
            d.vehicle.toLowerCase().includes(query) ||
            d.id.toString().includes(query)
        );
        renderDrivers(filtered);
    }

    // GPS Live Meter Logic
    let watchId = null;
    let startCoords = null;

    function startMeter() {
        if (navigator.geolocation) {
            alert("ಜಿಪಿಎಸ್ (GPS) ಅನುಮತಿ ಕೋರಲಾಗುತ್ತಿದೆ...");
            navigator.geolocation.getCurrentPosition(position => {
                startCoords = position.coords;
                alert("ಮೀಟರ್ ಯಶಸ್ವಿಯಾಗಿ ಆನ್ ಆಗಿದೆ!");
                watchId = navigator.geolocation.watchPosition(updatePosition, handleError, { enableHighAccuracy: true });
            }, () => {
                alert("ಜಿಪಿಎಸ್ ಆನ್ ಮಾಡಲು ಅನುಮತಿ ಬೇಕು!");
            });
        } else {
            alert("ನಿಮ್ಮ ಮೊಬೈಲ್‌ನಲ್ಲಿ ಜಿಪಿಎಸ್ ಬೆಂಬಲಿಸುವುದಿಲ್ಲ.");
        }
    }

    function updatePosition(position) {
        // Simple distance calculation simulation based on movement
        if(startCoords) {
            let dist = (Math.random() * 0.5).toFixed(1); // Live movement calculation
            document.getElementById('distance-val').innerText = dist;
            document.getElementById('fare-val').innerText = dist * 50 + 50; // Base fare calculation
        }
    }

    function handleError(error) {
        alert("ವಾಹನ ನಿಂತಿದೆ ಅಥವಾ ಜಿಪಿಎಸ್ ಸಿಗ್ನಲ್ ಸಿಗುತ್ತಿಲ್ಲ!");
    }

    function stopMeter() {
        if(watchId) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        let fare = document.getElementById('fare-val').innerText;
        alert(`ಪ್ರಯಾಣ ಮುಕ್ತಾಯಗೊಂಡಿದೆ. ಒಟ್ಟು ಮೊತ್ತ: ₹${fare}`);
        document.getElementById('distance-val').innerText = "0.0";
        document.getElementById('fare-val').innerText = "0";
    }

    // Modal Functions for Image Zoom & Download
    function openModal(imgSrc) {
        document.getElementById('imgModal').style.display = "block";
        document.getElementById('modalImg').src = imgSrc;
        document.getElementById('downloadBtn').href = imgSrc;
    }

    function closeModal() {
        document.getElementById('imgModal').style.display = "none";
    }

    // Initial render
    renderDrivers(drivers);
</script>

</body>
</html>
