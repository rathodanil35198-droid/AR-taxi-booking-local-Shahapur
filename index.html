<!DOCTYPE html>
<html lang="kn" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Taxi Shahapur</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --accent: #ffc107;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 10px; }
        .container { max-width: 450px; margin: 0 auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; padding-bottom: 20px; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; position: relative; }
        header h1 { font-size: 1.3rem; margin-bottom: 5px; }
        .lang-switch { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
        .tabs { display: flex; background: #e0e0e0; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; cursor: pointer; font-weight: bold; font-size: 0.9rem; color: #555; transition: 0.3s; }
        .tab-btn.active { background: var(--card-bg); color: var(--primary); border-bottom: 3px solid var(--primary); }
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:active { background: var(--primary-dark); }
        .btn-accent { background: var(--accent); color: #000; }
        .meter-box { background: #e8f5e9; border: 2px dashed var(--primary); padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px; }
        .meter-value { font-size: 1.8rem; font-weight: bold; color: var(--primary-dark); margin: 5px 0; }
        .footer { text-align: center; font-size: 0.75rem; color: #777; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <button class="lang-switch" onclick="toggleLanguage()">ಕನ್ನಡ / Eng</button>
        <h1 id="mainTitle">🛺 AR Taxi Shahapur</h1>
        <p id="subTitle" style="font-size: 0.8rem; opacity: 0.9;">ಸ್ಥಳೀಯ ಆಟೋ ಹಾಗೂ ಟ್ಯಾಕ್ಸಿ ಬುಕಿಂಗ್ ಸೇವೆ</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('booking', event)" id="tabBookingBtn">ಬುಕಿಂಗ್</button>
        <button class="tab-btn" onclick="switchTab('driver', event)" id="tabDriverBtn">ಡ್ರೈವರ್ ಲೈವ್</button>
        <button class="tab-btn" onclick="switchTab('register', event)" id="tabRegBtn">ನೋಂದಣಿ</button>
    </div>

    <!-- Booking Tab -->
    <div id="bookingTab" class="tab-content active">
        <div class="form-group">
            <label id="lblName">ನಿಮ್ಮ ಹೆಸರು:</label>
            <input type="text" id="custName" placeholder="ಹೆಸರು ನಮೂದಿಸಿ">
        </div>
        <div class="form-group">
            <label id="lblPhone">ಮೊಬೈಲ್ ನಂಬರ್:</label>
            <input type="tel" id="custPhone" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್">
        </div>
        <div class="form-group">
            <label id="lblVehicle">ವಾಹನದ ಪ್ರಕಾರ:</label>
            <select id="vehicleType">
                <option value="AUTO">🛺 ಆಟೋ (Auto)</option>
                <option value="TATA ACE">🚛 ಗೂಡ್ಸ್ / ಟಾಟಾ ಏಸ್</option>
                <option value="TAXI CAR">🚗 ಟ್ಯಾಕ್ಸಿ ಕಾರ್ (Car)</option>
            </select>
        </div>
        <div class="form-group">
            <label id="lblPickup">ಪ್ರಸ್ತುತ ಸ್ಥಳ (GPS):</label>
            <button type="button" class="btn btn-accent" onclick="getLocation()" id="getLocBtn">📍 ಜಿಪಿಎಸ್ ಲೊಕೇಶನ್ ಪಡೆಯಿರಿ</button>
            <p id="locStatus" style="font-size: 0.75rem; margin-top: 5px; color: #666;"></p>
        </div>
        <div class="form-group">
            <label id="lblDrop">ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕು?:</label>
            <input type="text" id="dropLocation" placeholder="ಉದಾ: ಶಹಾಪುರ ಬಸ್ ನಿಲ್ದಾಣ">
        </div>
        <div class="form-group">
            <label id="lblFare">ಅಂದಾಜು ಬೆಲೆ (₹):</label>
            <input type="number" id="estFare" placeholder="50">
        </div>
        <button class="btn" onclick="sendBooking()" id="bookNowBtn">🚀 ವಾಟ್ಸಾಪ್ ಮೂಲಕ ಬುಕ್ ಮಾಡಿ</button>
    </div>

    <!-- Driver Live & Meter Tab -->
    <div id="driverTab" class="tab-content">
        <h3 style="font-size: 1rem; color: var(--primary-dark); margin-bottom: 10px;" id="driverHead">🛺 ಡ್ರೈವರ್ ಲೈವ್ ಮೀಟರ್ & ಜಿಪಿಎಸ್</h3>
        <p style="font-size: 0.8rem; color: #555; margin-bottom: 15px;" id="driverSub">ಪ್ರಯಾಣದ ಸಮಯದಲ್ಲಿ ಮೀಟರ್ ಆನ್ ಮಾಡಿ ದೂರ ಮತ್ತು ಹಣವನ್ನು ಲೆಕ್ಕ ಹಾಕಿ.</p>
        
        <div class="meter-box">
            <div style="font-size: 0.85rem;" id="lblDist">ಚಲಿಸಿದ ದೂರ:</div>
            <div class="meter-value" id="distanceVal">0.00 ಕಿ.ಮೀ</div>
            <div style="font-size: 0.85rem; margin-top: 10px;" id="lblAmt">ಒಟ್ಟು ಅಂದಾಜು ಹಣ:</div>
            <div class="meter-value" id="fareVal">₹ 0</div>
            
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="btn" style="background: #2e7d32; margin-top:0;" onclick="startMeter()" id="startMeterBtn">ಚಾಲುಮಾಡಿ (Start)</button>
                <button class="btn" style="background: #c62828; margin-top:0;" onclick="stopMeter()" id="stopMeterBtn">ನಿಲ್ಲಿಸಿ (Stop)</button>
            </div>
        </div>
        
        <div style="margin-top: 20px;">
            <button class="btn btn-accent" onclick="openDriverWhatsApp()" id="sendDriverUpdateBtn">ವಾಟ್ಸಾಪ್‌ಗೆ ಮೀಟರ್ ವರದಿ ಕಳುಹಿಸಿ</button>
        </div>
    </div>

    <!-- Driver Registration Tab -->
    <div id="registerTab" class="tab-content">
        <div class="form-group">
            <label id="lblRegName">ಡ್ರೈವರ್ ಹೆಸರು:</label>
            <input type="text" id="driverName" placeholder="ನಿಮ್ಮ ಹೆಸರು">
        </div>
        <div class="form-group">
            <label id="lblRegPhone">ಮೊಬೈಲ್ ನಂಬರ್:</label>
            <input type="tel" id="driverPhone" placeholder="ಮೊಬೈಲ್ ನಂಬರ್">
        </div>
        <div class="form-group">
            <label id="lblRegVehicle">ವಾಹನ ಪ್ರಕಾರ:</label>
            <select id="driverVehicleType">
                <option value="AUTO">🛺 ಆಟೋ</option>
                <option value="TAXI">🚗 ಟ್ಯಾಕ್ಸಿ</option>
            </select>
        </div>
        <div class="form-group">
            <label id="lblRegNo">ವಾಹನ ನಂಬರ್ (Vehicle No):</label>
            <input type="text" id="vehicleNo" placeholder="KA 33 ...">
        </div>
        <button class="btn" onclick="registerDriver()" id="regBtn">✍️ ಡ್ರೈವರ್ ನೋಂದಣಿ ಮಾಡಿ</button>
    </div>

    <div class="footer">
        © 2026 AR Taxi Shahapur. All rights reserved.
    </div>
</div>

<script>
    let currentLang = 'kn';
    let lat = '16.7000', lon = '76.9500';
    let watchId = null;
    let distance = 0;
    let lastLat = null, lastLon = null;
    let isMeterRunning = false;
    
    // ನಿಮ್ಮ ವಾಟ್ಸಾಪ್ ಗ್ರೂಪ್ ಅಥವಾ ಪರ್ಸನಲ್ ನಂಬರ್ ಇಲ್ಲಿರುತ್ತದೆ
    const DRIVER_WHATSAPP = "918105054389"; 

    function toggleLanguage() {
        currentLang = currentLang === 'kn' ? 'en' : 'kn';
        document.getElementById('htmlRoot').lang = currentLang;
        
        if(currentLang === 'en') {
            document.getElementById('mainTitle').innerText = "🛺 AR Taxi Shahapur";
            document.getElementById('subTitle').innerText = "Local Auto & Taxi Booking Service";
            document.getElementById('tabBookingBtn').innerText = "Booking";
            document.getElementById('tabDriverBtn').innerText = "Driver Live";
            document.getElementById('tabRegBtn').innerText = "Register";
            document.getElementById('lblName').innerText = "Customer Name:";
            document.getElementById('lblPhone').innerText = "Mobile Number:";
            document.getElementById('lblVehicle').innerText = "Vehicle Type:";
            document.getElementById('lblPickup').innerText = "Current Location (GPS):";
            document.getElementById('getLocBtn').innerText = "📍 Get GPS Location";
            document.getElementById('lblDrop').innerText = "Drop Location:";
            document.getElementById('lblFare').innerText = "Estimated Fare (₹):";
            document.getElementById('bookNowBtn').innerText = "🚀 Book via WhatsApp";
            document.getElementById('driverHead').innerText = "🛺 Driver Live Meter & GPS";
            document.getElementById('driverSub').innerText = "Turn on meter during ride to track distance & fare.";
            document.getElementById('lblDist').innerText = "Distance Travelled:";
            document.getElementById('lblAmt').innerText = "Total Estimated Fare:";
            document.getElementById('startMeterBtn').innerText = "Start Meter";
            document.getElementById('stopMeterBtn').innerText = "Stop Meter";
            document.getElementById('sendDriverUpdateBtn').innerText = "Send Update to WhatsApp";
            document.getElementById('lblRegName').innerText = "Driver Name:";
            document.getElementById('lblRegPhone').innerText = "Mobile Number:";
            document.getElementById('lblRegVehicle').innerText = "Vehicle Type:";
            document.getElementById('lblRegNo').innerText = "Vehicle Number:";
            document.getElementById('regBtn').innerText = "✍️ Register Driver";
        } else {
            document.getElementById('mainTitle').innerText = "🛺 AR Taxi Shahapur";
            document.getElementById('subTitle').innerText = "ಸ್ಥಳೀಯ ಆಟೋ ಹಾಗೂ ಟ್ಯಾಕ್ಸಿ ಬುಕಿಂಗ್ ಸೇವೆ";
            document.getElementById('tabBookingBtn').innerText = "ಬುಕಿಂಗ್";
            document.getElementById('tabDriverBtn').innerText = "ಡ್ರೈವರ್ ಲೈವ್";
            document.getElementById('tabRegBtn').innerText = "ನೋಂದಣಿ";
            document.getElementById('lblName').innerText = "ನಿಮ್ಮ ಹೆಸರು:";
            document.getElementById('lblPhone').innerText = "ಮೊಬೈಲ್ ನಂಬರ್:";
            document.getElementById('lblVehicle').innerText = "ವಾಹನದ ಪ್ರಕಾರ:";
            document.getElementById('lblPickup').innerText = "ಪ್ರಸ್ತುತ ಸ್ಥಳ (GPS):";
            document.getElementById('getLocBtn').innerText = "📍 ಜಿಪಿಎಸ್ ಲೊಕೇಶನ್ ಪಡೆಯಿರಿ";
            document.getElementById('lblDrop').innerText = "ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕು?:";
            document.getElementById('lblFare').innerText = "ಅಂದಾಜು ಬೆಲೆ (₹):";
            document.getElementById('bookNowBtn').innerText = "🚀 ವಾಟ್ಸಾಪ್ ಮೂಲಕ ಬುಕ್ ಮಾಡಿ";
            document.getElementById('driverHead').innerText = "🛺 ಡ್ರೈವರ್ ಲೈವ್ ಮೀಟರ್ & ಜಿಪಿಎಸ್";
            document.getElementById('driverSub').innerText = "ಪ್ರಯಾಣದ ಸಮಯದಲ್ಲಿ ಮೀಟರ್ ಆನ್ ಮಾಡಿ ದೂರ ಮತ್ತು ಹಣವನ್ನು ಲೆಕ್ಕ ಹಾಕಿ.";
            document.getElementById('lblDist').innerText = "ಚಲಿಸಿದ ದೂರ:";
            document.getElementById('lblAmt').innerText = "ಒಟ್ಟು ಅಂದಾಜು ಹಣ:";
            document.getElementById('startMeterBtn').innerText = "ಚಾಲುಮಾಡಿ (Start)";
            document.getElementById('stopMeterBtn').innerText = "ನಿಲ್ಲಿಸಿ (Stop)";
            document.getElementById('sendDriverUpdateBtn').innerText = "ವಾಟ್ಸಾಪ್‌ಗೆ ಮೀಟರ್ ವರದಿ ಕಳುಹಿಸಿ";
            document.getElementById('lblRegName').innerText = "ಡ್ರೈವರ್ ಹೆಸರು:";
            document.getElementById('lblRegPhone').innerText = "ಮೊಬೈಲ್ ನಂಬರ್:";
            document.getElementById('lblRegVehicle').innerText = "ವಾಹನ ಪ್ರಕಾರ:";
            document.getElementById('lblRegNo').innerText = "ವಾಹನ ನಂಬರ್:";
            document.getElementById('regBtn').innerText = "✍️ ಡ್ರೈವರ್ ನೋಂದಣಿ ಮಾಡಿ";
        }
    }

    function switchTab(tabName, event) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        if(tabName === 'booking') {
            document.getElementById('bookingTab').classList.add('active');
        } else if(tabName === 'driver') {
            document.getElementById('driverTab').classList.add('active');
        } else if(tabName === 'register') {
            document.getElementById('registerTab').classList.add('active');
        }
        event.currentTarget.classList.add('active');
    }

    function getLocation() {
        const status = document.getElementById('locStatus');
        if (!navigator.geolocation) {
            status.innerText = "ಜಿಪಿಎಸ್ ಸೌಲಭ್ಯ ಲಭ್ಯವಿಲ್ಲ";
            return;
        }
        status.innerText = "ಲೊಕೇಶನ್ ಪಡೆಯಲಾಗುತ್ತಿದೆ...";
        navigator.geolocation.getCurrentPosition((position) => {
            lat = position.coords.latitude.toFixed(4);
            lon = position.coords.longitude.toFixed(4);
            status.innerText = `✅ GPS ಲೊಕೇಶನ್ ಸಿಕ್ಕಿದೆ (${lat}, ${lon})`;
        }, () => {
            status.innerText = "❌ ಲೊಕೇಶನ್ ಸಿಗಲಿಲ್ಲ. ದಯವಿಟ್ಟು ಜಿಪಿಎಸ್ ಆನ್ ಮಾಡಿ.";
        }, { enableHighAccuracy: true });
    }

    function sendBooking() {
        let name = document.getElementById('custName').value.trim();
        let phone = document.getElementById('custPhone').value.trim();
        let vehicle = document.getElementById('vehicleType').value;
        let drop = document.getElementById('dropLocation').value.trim();
        let fare = document.getElementById('estFare').value.trim();

        if(!name || !phone) {
            alert("ದಯವಿಟ್ಟು ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ನಂಬರ್ ನಮೂದಿಸಿ!");
            return;
        }

        let mapLink = `https://maps.google.com/?q=${lat},${lon}`;
        let message = `🛺 *AR TAXI SHAHAPUR - NEW BOOKING* 🛺\n\n` +
                      `👤 ಕಸ್ಟಮರ್ ಹೆಸರು: ${name}\n` +
                      `📞 ಮೊಬೈಲ್: ${phone}\n` +
                      `🚗 ವಾಹನ: ${vehicle}\n` +
                      `📍 ಎಲ್ಲಿಂದ (GPS Map): ${mapLink}\n` +
                      `🏁 ಎಲ್ಲಿಗೆ: ${drop || 'Not specified'}\n` +
                      `💰 ಅಂದಾಜು ಬೆಲೆ: ₹${fare || '50'}`;

        let url = `https://wa.me/${DRIVER_WHATSAPP}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    function registerDriver() {
        let name = document.getElementById('driverName').value.trim();
        let phone = document.getElementById('driverPhone').value.trim();
        let vehicle = document.getElementById('driverVehicleType').value;
        let vNo = document.getElementById('vehicleNo').value.trim();

        if(!name || !phone || !vNo) {
            alert("ಎಲ್ಲಾ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ!");
            return;
        }

        let message = `📝 *AR TAXI SHAHAPUR - DRIVER REGISTRATION* 📝\n\n` +
                      `👤 ಹೆಸರು: ${name}\n` +
                      `📞 ಮೊಬೈಲ್: ${phone}\n` +
                      `🛺 ವಾಹನ: ${vehicle}\n` +
                      `🔢 ವಾಹನ ನಂಬರ್: ${vNo}`;

        let url = `https://wa.me/${DRIVER_WHATSAPP}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    // Driver Live Meter Functions
    function startMeter() {
        if (isMeterRunning) return;
        if (!navigator.geolocation) {
            alert("ಜಿಪಿಎಸ್ ಸೌಲಭ್ಯ ಲಭ್ಯವಿಲ್ಲ!");
            return;
        }
        isMeterRunning = true;
        distance = 0;
        lastLat = null;
        lastLon = null;
        alert("ಮೀಟರ್ ಚಾಲೂ ಆಗಿದೆ!");

        watchId = navigator.geolocation.watchPosition((position) => {
            let currentLat = position.coords.latitude;
            let currentLon = position.coords.longitude;

            if (lastLat !== null && lastLon !== null) {
                let distInc = calculateDistance(lastLat, lastLon, currentLat, currentLon);
                distance += distInc;
                
                document.getElementById('distanceVal').innerText = distance.toFixed(2) + " ಕಿ.ಮೀ";
                // 1 ಕಿ.ಮೀ ಗೆ ₹15 ಅಥವಾ ಮೂಲ ದರ ಲೆಕ್ಕಾಚಾರ
                let calculatedFare = Math.max(30, Math.round(distance * 15));
                document.getElementById('fareVal').innerText = "₹ " + calculatedFare;
            }
            lastLat = currentLat;
            lastLon = currentLon;
        }, (error) => {
            console.error(error);
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    }

    function stopMeter() {
        if (!isMeterRunning) return;
        isMeterRunning = false;
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        alert("ಮೀಟರ್ ನಿಲ್ಲಿಸಲಾಗಿದೆ!");
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        let R = 6371; // Earth radius in km
        let dLat = deg2rad(lat2 - lat1);
        let dLon = deg2rad(lon2 - lon1);
        let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
        let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function deg2rad(deg) {
        return deg * (Math.PI/180);
    }

    function openDriverWhatsApp() {
        let distText = document.getElementById('distanceVal').innerText;
        let fareText = document.getElementById('fareVal').innerText;
        let message = `🛺 *AR TAXI - DRIVER METER REPORT* 🛺\n\n` +
                      `📏 ಚಲಿಸಿದ ದೂರ: ${distText}\n` +
                      `💰 ಒಟ್ಟು ಹಣ: ${fareText}`;
        let url = `https://wa.me/${DRIVER_WHATSAPP}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
