<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Taxi Shahapur - Live Booking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #eef2f3;
            padding: 10px;
            border-radius: 10px;
        }
        .mode-selector button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-cust-switch { background: #3498db; color: white; }
        .btn-drv-switch { background: #e74c3c; color: white; }
        
        /* ಕಸ್ಟಮರ್ ವ್ಯೂ ಸ್ಟೈಲ್ */
        .status-message {
            font-size: 16px;
            color: #2e7d32;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
            border: 1px solid #a5d6a7;
            margin-top: 20px;
        }

        /* ಡ್ರೈವರ್ ವ್ಯೂ ಸ್ಟೈಲ್ */
        .driver-alert-box {
            background: #fff3e0;
            border: 2px dashed #ff9800;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .driver-alert-box h3 {
            color: #d35400;
            margin-bottom: 15px;
        }
        .order-detail {
            font-size: 15px;
            margin-bottom: 10px;
        }
        .btn-success {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-success:hover {
            background: #219653;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛺 AR Taxi Shahapur 🛺</h2>
    
    <!-- ಟೆಸ್ಟಿಂಗ್ ಮಾಡಲು ಇಲ್ಲೇ ಮೋಡ್ ಬದಲಾಯಿಸಬಹುದು (Customer / Driver) -->
    <div class="mode-selector">
        <button class="btn-cust-switch" onclick="setMode('customer')">ಕಸ್ಟಮರ್ ವ್ಯೂ (Customer)</button>
        <button class="btn-drv-switch" onclick="setMode('driver')">ಡ್ರೈವರ್ ವ್ಯೂ (Driver)</button>
    </div>

    <!-- 1. ಕಸ್ಟಮರ್ ಪರದೆ (Customer View) -->
    <div id="customerView" style="display: block;">
        <div class="status-message">
            🚗 ನಿಮ್ಮ ಬುಕಿಂಗ್ ಅನ್ನು ಡ್ರೈವರ್‌ಗೆ ಕಳುಹಿಸಲಾಗಿದೆ, ದಯವಿಟ್ಟು ನಿರೀಕ್ಷಿಸಿ. ಡ್ರೈವರ್ ಸ್ವೀಕರಿಸುತ್ತಾರೆ!
        </div>
        <!-- ಗಮನಿಸಿ: ಇಲ್ಲಿ ಕೆಂಪು ಬಣ್ಣದ ಕ್ಯಾನ್ಸಲ್ ಪಟ್ಟಿ ಅಥವಾ ಬಟನ್ ಅನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ತೆಗೆದುಹಾಕಲಾಗಿದೆ -->
    </div>

    <!-- 2. ಡ್ರೈವರ್ ಪರದೆ (Driver View - ಇಲ್ಲಿ ಮಾತ್ರ ಆಡಿಯೋ ಸೌಂಡ್ ಮತ್ತು ಆರ್ಡರ್ ಬರುತ್ತದೆ) -->
    <div id="driverView" style="display: none;">
        <div class="driver-alert-box">
            <h3>🔔 ಹೊಸ ಲೈವ್ ಬುಕಿಂಗ್ ಆರ್ಡರ್ ಬಂದಿದೆ!</h3>
            <div class="order-detail"><b>ಕಸ್ಟಮರ್ ಹೆಸರು:</b> Babu</div>
            <div class="order-detail"><b>ಫೋನ್ ನಂಬರ್:</b> 9056828438</div>
            <div class="order-detail"><b>ವಾಹನ ಪ್ರಕಾರ:</b> Auto</div>
            <div class="order-detail"><b>ಪಿಕಪ್ ಸ್ಥಳ:</b> Bheemrav</div>
            <div class="order-detail"><b>ಡ್ರಾಪ್ ಸ್ಥಳ:</b> Shahapur</div>
            
            <button class="btn-success" onclick="acceptBooking()">ಬುಕಿಂಗ್ ಸ್ವೀಕರಿಸಿ (Accept)</button>
        </div>
    </div>
</div>

<!-- ಆಡಿಯೋ ಫೈಲ್ (ಡ್ರೈವರ್ ಫೋನ್‌ಗೆ ಮಾತ್ರ ಪ್ಲೇ ಆಗುತ್ತದೆ) -->
<audio id="alertAudio" src="https://www.soundjay.com/buttons/sounds/button-3.mp3" preload="auto"></audio>

<script>
    // ಡಿಫಾಲ್ಟ್ ಆಗಿ ಕಸ್ಟಮರ್ ವ್ಯೂ ತೋರಿಸುತ್ತದೆ
    function setMode(role) {
        if (role === 'driver') {
            document.getElementById('driverView').style.display = 'block';
            document.getElementById('customerView').style.display = 'none';
            playAudioAlert(); // ಡ್ರೈವರ್ ಮೋಡ್ ಬಂದಾಗ ಮಾತ್ರ ಸೌಂಡ್ ಬರುತ್ತದೆ
        } else {
            document.getElementById('driverView').style.display = 'none';
            document.getElementById('customerView').style.display = 'block';
        }
    }

    // ಆಡಿಯೋ ಸೌಂಡ್ ಪ್ಲೇ ಮಾಡುವ ಫಂಕ್ಷನ್
    function playAudioAlert() {
        const audio = document.getElementById('alertAudio');
        audio.play().catch(error => {
            console.log("Audio play blocked by browser policy, tap required.");
        });
    }

    function acceptBooking() {
        alert("ನೀವು ಬುಕಿಂಗ್ ಅನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಸ್ವೀಕರಿಸಿದ್ದೀರಿ!");
    }
</script>

</body>
</html>
