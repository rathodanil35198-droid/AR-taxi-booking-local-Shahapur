<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Taxi Shahapur - Live Meter & Booking</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00b09b, #96c93d);
            --car-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --light-bg: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light-bg);
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background: var(--primary-gradient);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
        
        .container { max-width: 500px; margin: 20px auto; padding: 15px; }
        
        .whatsapp-box {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(37,211,102,0.2);
        }
        .whatsapp-btn {
            background: white;
            color: #128c7e;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 5px solid #00b09b;
        }
        
        h2 { font-size: 18px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 0; }
        
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; color: #475569; }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .live-meter-box {
            background: #1e293b;
            color: #38bdf8;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            font-family: monospace;
        }
        .meter-display { font-size: 28px; font-weight: bold; color: #4ade80; }
    </style>
</head>
<body>

    <header>
        <h1>🛺 🚗 AR Taxi Shahapur</h1>
        <p>ಲೈವ್ ಜಿಪಿಎಸ್ ಮೀಟರ್ ಹಾಗೂ ಬುಕಿಂಗ್ ಸೇವೆ</p>
    </header>

    <div class="container">

        <!-- ವಾಟ್ಸಾಪ್ ಗ್ರೂಪ್ ಜಾಯಿನ್ -->
        <div class="whatsapp-box">
            <p style="margin:0; font-weight:bold;">ಡ್ರೈವರ್‌ಗಳು ವಾಟ್ಸಾಪ್ ಗ್ರೂಪ್‌ಗೆ ಸೇರಲು ಇಲ್ಲಿ ಕ್ಲಿಕ್ ಮಾಡಿ:</p>
            <a href="https://chat.whatsapp.com/IA8IgVgA1iUK00rs3wmMcN" target="_blank" class="whatsapp-btn">💬 WhatsApp Group Join</a>
        </div>

        <!-- ಗ್ರಾಹಕರ ಬುಕಿಂಗ್ ಮತ್ತು ಜಿಪಿಎಸ್ ಲೈವ್ ಮೀಟರ್ -->
        <div class="card">
            <h2>🛺 🚗 ಗ್ರಾಹಕರ ಬುಕಿಂಗ್ & ಲೈವ್ ಮೀಟರ್</h2>
            <form id="bookingForm">
                <label>ನಿಮ್ಮ ಹೆಸರು:</label>
                <input type="text" id="custName" placeholder="ಹೆಸರು ನಮೂದಿಸಿ" required>

                <label>ಮೊಬೈಲ್ ನಂಬರ್:</label>
                <input type="tel" id="custPhone" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್" pattern="[0-9]{10}" required>

                <label>ವಾಹನದ ಪ್ರಕಾರ:</label>
                <select id="vehicleType">
                    <option value="auto">🛺 ಆಟೋ (ಮೊದಲ 4 ಕಿ.ಮೀ ರೂ. 50, ಮುಂದೆ ಪ್ರತಿ ಕಿ.ಮೀ ರೂ. 12)</option>
                    <option value="car">🚗 ಕಾರ್ (ಮೊದಲ 3 ಕಿ.ಮೀ ರೂ. 400, ಮುಂದೆ ಪ್ರತಿ ಕಿ.ಮೀ ರೂ. 15)</option>
                </select>

                <button type="button" class="btn" onclick="requestGPSAndBook()">📍 ಜಿಪಿಎಸ್ ಆನ್ ಮಾಡಿ ಬುಕ್ ಮಾಡಿ</button>
            </form>

            <!-- ಲೈವ್ ಮೀಟರ್ ಡಿಸ್ಪ್ಲೇ -->
            <div class="live-meter-box" id="meterBox" style="display:none;">
                <div>ಲೈವ್ ಪ್ರಯಾಣದ ಮೀಟರ್ (Live Meter)</div>
                <div class="meter-display" id="distanceText">0.0 ಕಿ.ಮೀ</div>
                <div style="font-size: 18px; color: #facc15;" id="fareText">ಬಾಡಿಗೆ: ರೂ. 0</div>
                <button class="btn" style="background: #ef4444; margin-top: 10px;" onclick="stopTrip()">ಟ್ರಿಪ್ ಮುಕ್ತಾಯಗೊಳಿಸಿ</button>
            </div>
        </div>

    </div>

    <script>
        let watchId = null;
        let startCoords = null;
        let totalDistance = 0;

        function requestGPSAndBook() {
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;

            if(!name || !phone) {
                alert('ದಯವಿಟ್ಟು ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ನಂಬರ್ ನಮೂದಿಸಿ.');
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    startCoords = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };
                    alert('ಜಿಪಿಎಸ್ (GPS) ಯಶಸ್ವಿಯಾಗಿ ಆನ್ ಆಗಿದೆ! ಟ್ರಿಪ್ ಪ್ರಾರಂಭವಾಗಿದೆ.');
                    document.getElementById('meterBox').style.display = 'block';
                    startLiveMeter();
                }, function(error) {
                    alert('ದಯವಿಟ್ಟು ನಿಮ್ಮ ಫೋನ್‌ನಲ್ಲಿ ಜಿಪಿಎಸ್ (Location) ಆನ್ ಮಾಡಿ!');
                }, { enableHighAccuracy: true });
            } else {
                alert('ನಿಮ್ಮ ಬ್ರೌಸರ್ ಜಿಪಿಎಸ್ ಬೆಂಬಲಿಸುವುದಿಲ್ಲ.');
            }
        }

        function startLiveMeter() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(function(position) {
                    if (startCoords) {
                        let currentCoords = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        };
                        // ದೂರ ಲೆಕ್ಕಾಚಾರ (ಕಿ.ಮೀ ನಲ್ಲಿ)
                        totalDistance = calculateDistance(startCoords.latitude, startCoords.longitude, currentCoords.latitude, currentCoords.longitude);
                        
                        let vType = document.getElementById('vehicleType').value;
                        let fare = 0;

                        if(vType === 'auto') {
                            if(totalDistance <= 4) {
                                fare = 50;
                            } else {
                                fare = 50 + Math.ceil(totalDistance - 4) * 12;
                            }
                        } else {
                            if(totalDistance <= 3) {
                                fare = 400;
                            } else {
                                font = 400 + Math.ceil(totalDistance - 3) * 15;
                                fare = 400 + Math.ceil(totalDistance - 3) * 15;
                            }
                        }

                        document.getElementById('distanceText').innerText = totalDistance.toFixed(2) + " ಕಿ.ಮೀ";
                        document.getElementById('fareText').innerText = "ಬಾಡಿಗೆ: ರೂ. " + fare;
                    }
                }, function(error) {
                    console.log("GPS Error");
                }, { enableHighAccuracy: true });
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            let R = 6371; // Earth radius in km
            let dLat = deg2rad(lat2 - lat1);
            let dLon = deg2rad(lon2 - lon1);
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        function stopTrip() {
            if(watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            alert('ಟ್ರಿಪ್ ಮುಕ್ತಾಯಗೊಂಡಿದೆ. ಒಟ್ಟು ದೂರ: ' + totalDistance.toFixed(2) + ' ಕಿ.ಮೀ');
            document.getElementById('meterBox').style.display = 'none';
        }
    </script>
</body>
</html>
